name: Sync products from Loyverse

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync products from Loyverse
        env:
          LOYVERSE_ACCESS_TOKEN: ${{ secrets.LOYVERSE_ACCESS_TOKEN }}
          LOYVERSE_STORE_ID: ${{ secrets.LOYVERSE_STORE_ID }}
        run: npm run sync-products

      - name: Commit and push if catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/products/
          if git diff --cached --quiet; then
            echo "No catalog changes, skipping commit."
          else
            git commit -m "chore: sync products from Loyverse [skip ci]"
            git push
          fi
